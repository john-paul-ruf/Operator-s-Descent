<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat — Operator's Descent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --accent: #7ec8e3;
      --bg-base: #0a0612;
      --bg-panel: #13092a;
      --bg-panel-elevated: #1a0e36;
      --border-dim: #2a1a4a;
      --text-primary: #e0d8f0;
      --text-secondary: #8a7aa8;
      --text-dim: #5a4a78;
      --danger: #e83a3a;
      --heal: #3ae8a8;
      --warning: #e8632a;
    }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: ui-monospace, 'SF Mono', 'Roboto Mono', Consolas, monospace;
      margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .portrait-frame {
      width: 100%; max-width: 450px;
      aspect-ratio: 1080/1920; max-height: 100vh;
      position: relative; background: var(--bg-base);
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* ═══ CRT / VHS EFFECT SYSTEM ═══ */
    .crt-scanlines {
      position: absolute; inset: 0; pointer-events: none; z-index: 60;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 1px,
        rgba(255,255,255,0.10) 1px, rgba(255,255,255,0.10) 2px);
      animation: scanline-drift 4s linear infinite;
    }
    @keyframes scanline-drift { 0% { transform: translateY(0); } 100% { transform: translateY(2px); } }

    .crt-grille {
      position: absolute; inset: 0; pointer-events: none; z-index: 59;
      background: repeating-linear-gradient(to right,
        rgba(255,0,0,0.50) 0, rgba(255,0,0,0.50) 1px,
        rgba(0,255,0,0.50) 1px, rgba(0,255,0,0.50) 2px,
        rgba(0,0,255,0.50) 2px, rgba(0,0,255,0.50) 3px);
      mix-blend-mode: screen;
      opacity: 0.15;
    }

    .crt-vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 58;
      background: radial-gradient(ellipse at center,
        transparent 30%, rgba(0,0,0,0.65) 100%);
      animation: vignette-pulse 4s ease-in-out infinite;
    }
    @keyframes vignette-pulse { 0%,100% { opacity: 0.65; } 50% { opacity: 0.92; } }

    .crt-tracking {
      position: absolute; left: 0; right: 0; height: 28%; z-index: 57;
      pointer-events: none;
      background: rgba(126,200,227,0.05);
      mix-blend-mode: screen;
      animation: tracking-loop 7s linear infinite;
    }
    @keyframes tracking-loop { 0% { top: -28%; } 100% { top: 100%; } }

    .crt-grain {
      position: absolute; inset: 0; pointer-events: none; z-index: 56;
      opacity: 0.5;
      background-image:
        radial-gradient(circle at 3% 7%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 17% 13%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 31% 3%, rgba(255,255,255,0.18) 0.5px, transparent 1px),
        radial-gradient(circle at 43% 19%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 57% 7%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 71% 23%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 83% 11%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 91% 29%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 7% 37%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 21% 43%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 37% 31%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 51% 47%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 63% 41%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 77% 37%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 89% 49%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 11% 61%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 27% 53%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 41% 67%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 53% 59%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 67% 73%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 79% 61%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 93% 71%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 5% 83%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 19% 79%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 33% 91%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 47% 83%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 61% 89%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 73% 81%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 87% 93%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 97% 87%, rgba(255,255,255,0.12) 0.5px, transparent 1px);
      background-size: 100% 100%;
      animation: grain-rescatter 1s steps(4) infinite;
    }
    @keyframes grain-rescatter {
      0% { transform: translate(0,0); } 25% { transform: translate(-2px,1px); }
      50% { transform: translate(1px,-2px); } 75% { transform: translate(-1px,-1px); }
      100% { transform: translate(2px,1px); }
    }

    .crt-border {
      position: absolute; inset: 0; pointer-events: none; z-index: 55;
      box-shadow:
        inset 0 0 3px rgba(126,200,227,0.3),
        inset 0 0 8px rgba(126,200,227,0.15),
        inset 0 0 20px rgba(0,0,0,0.4);
      animation: border-flicker 0.8s steps(1) infinite;
    }
    @keyframes border-flicker {
      0% { opacity: 0.7; } 35% { opacity: 0.7; } 36% { opacity: 0.5; }
      42% { opacity: 0.9; } 50% { opacity: 0.6; } 55% { opacity: 0.8; }
      100% { opacity: 0.7; }
    }

    .crt-flash {
      position: absolute; inset: 0; pointer-events: none; z-index: 62;
      background: rgba(208,38,212,0.05);
      opacity: 0;
      animation: frame-flash 3.2s steps(1) infinite;
    }
    @keyframes frame-flash {
      0%,85% { opacity: 0; } 86% { opacity: 0.05; } 88% { opacity: 0; } 100% { opacity: 0; }
    }

    .crt-glitch-bars { position: absolute; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .glitch-bar { position: absolute; left: 0; right: 0; background: rgba(126,200,227,0.3); mix-blend-mode: screen; }

    .crt-noise-lines { position: absolute; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .noise-line { position: absolute; left: 0; right: 0; font-family: monospace; font-size: 8px;
      color: rgba(126,200,227,0.4); white-space: nowrap; overflow: hidden;
      letter-spacing: 1px; line-height: 10px; mix-blend-mode: screen; }

    .crt-vhs { position: absolute; inset: 0; pointer-events: none; z-index: 61; opacity: 0; overflow: hidden; }
    .crt-vhs.active { animation: vhs-event 0.2s steps(1); }
    @keyframes vhs-event {
      0% { opacity: 0; } 20% { opacity: 1; transform: translateX(3px); }
      40% { opacity: 0.8; transform: translateX(-4px); } 60% { opacity: 1; transform: translateX(2px); }
      80% { opacity: 0.5; transform: translateX(-1px); } 100% { opacity: 0; transform: translateX(0); }
    }
    .crt-vhs::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(255,0,0,0.08) 0%, transparent 3%, rgba(0,0,255,0.08) 97%, transparent 100%);
    }
    .crt-vhs::after {
      content: ''; position: absolute; left: 0; right: 0; top: 30%;
      height: 4px; background: rgba(255,255,255,0.15); mix-blend-mode: screen;
    }

    /* ═══ END CRT EFFECTS ═══ */

    /* PER-ELEMENT TEXT GLITCH (FR-23) */
    [data-glitch] { position: relative; }
    [data-glitch].text-swapping::before,
    [data-glitch].text-swapping::after {
      content: attr(data-ghost-text); position: absolute; top: 0; left: 0;
      width: 100%; pointer-events: none; text-shadow: none;
    }
    [data-glitch].text-swapping::before { color: rgba(255,0,0,0.47); transform: translate(-2px,0); }
    [data-glitch].text-swapping::after { color: rgba(0,0,255,0.47); transform: translate(2px,0); }

    .glow { text-shadow: 0 0 8px var(--accent); }
    .glow-strong { text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent); }
    .glow-danger { text-shadow: 0 0 8px var(--danger); }
    .accent-text { color: var(--accent); }
    .panel { background: var(--bg-panel); border: 1px solid var(--border-dim); }
    .panel-elevated { background: var(--bg-panel-elevated); }

    .combat-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 0; flex: 1; background: var(--bg-base);
      position: relative;
    }
    .grid-cell {
      border: 1px solid rgba(42,26,74,0.4);
      display: flex; align-items: center; justify-content: center;
      position: relative; aspect-ratio: 1;
    }
    .grid-cell.wall { background: #0d0418; }
    .grid-cell.floor { background: rgba(126,200,227,0.02); }
    .grid-cell.cover { background: rgba(126,200,227,0.06); border-color: rgba(126,200,227,0.2); }
    .grid-cell.target-highlight { border: 2px solid var(--danger); box-shadow: inset 0 0 8px rgba(232,58,58,0.3); }
    .grid-cell.range-valid { border-color: rgba(126,200,227,0.3); }
    .grid-cell.deploy-p { background: rgba(126,200,227,0.03); }
    .grid-cell.deploy-e { background: rgba(232,58,58,0.03); }

    .token {
      width: 70%; height: 70%; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 10px;
    }
    .token-player {
      background: rgba(126,200,227,0.15); border: 1px solid var(--accent);
      color: var(--accent); text-shadow: 0 0 4px var(--accent);
      box-shadow: 0 0 4px var(--accent);
    }
    .token-player.active { border-width: 2px; box-shadow: 0 0 12px var(--accent), 0 0 20px var(--accent); }
    .token-enemy {
      background: rgba(232,58,58,0.15); border: 1px solid var(--danger);
      color: var(--danger); text-shadow: 0 0 4px var(--danger);
      box-shadow: 0 0 4px var(--danger);
    }
    .token-enemy.targeted { border-width: 2px; box-shadow: 0 0 12px var(--danger), 0 0 20px var(--danger); }
    .token-echo { background: rgba(232,58,58,0.1); border: 1px dashed var(--danger); }
    .token-dead { opacity: 0.2; filter: grayscale(1); }

    .init-rail { display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
    .init-rail::-webkit-scrollbar { display: none; }
    .init-slot {
      flex-shrink: 0; width: 36px; height: 44px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px;
      border: 1px solid var(--border-dim);
      font-size: 8px; cursor: pointer; transition: all 0.15s ease;
    }
    .init-slot.active { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); background: rgba(126,200,227,0.1); }
    .init-slot.enemy { border-color: rgba(232,58,58,0.3); }
    .init-slot.enemy.active { border-color: var(--danger); box-shadow: 0 0 8px var(--danger); background: rgba(232,58,58,0.1); }
    .init-sigil {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: bold;
    }
    .init-sigil.player { border: 1px solid var(--accent); color: var(--accent); box-shadow: 0 0 3px var(--accent); }
    .init-sigil.enemy { border: 1px solid var(--danger); color: var(--danger); box-shadow: 0 0 3px var(--danger); }

    .console-bar { background: var(--bg-panel); border-top: 1px solid var(--border-dim); z-index: 20;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.6), 0 -1px 4px rgba(126,200,227,0.1); }
    .mode-tab {
      flex: 1; padding: 10px 4px; text-align: center;
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-secondary); cursor: pointer;
      border-bottom: 2px solid transparent; min-height: 48px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .mode-tab:hover { color: var(--text-primary); }
    .mode-tab.active {
      border-bottom-color: var(--accent); color: var(--accent);
      text-shadow: 0 0 8px var(--accent); background: rgba(126,200,227,0.05);
      box-shadow: inset 0 -4px 8px rgba(126,200,227,0.1);
    }
    .mode-tab.disabled { opacity: 0.3; cursor: not-allowed; }

    .action-btn {
      background: var(--bg-panel-elevated); border: 1px solid var(--border-dim);
      color: var(--text-primary); padding: 14px 8px; font-family: inherit;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      cursor: pointer; transition: all 0.15s ease; text-align: center;
      min-height: 56px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      box-shadow: 0 0 4px rgba(0,0,0,0.4);
    }
    .action-btn:hover { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); color: var(--accent); }
    .action-btn:active { background: rgba(126,200,227,0.1); }
    .action-btn.selected { border-color: var(--accent); background: rgba(126,200,227,0.1); color: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .action-btn.danger { border-color: rgba(232,58,58,0.3); }
    .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .action-cost { font-size: 8px; color: var(--text-dim); }

    .bar-track { background: var(--bg-base); height: 3px; border: 1px solid var(--border-dim); border-radius: 0; }
    .bar-fill { height: 100%; }
    .bar-fill-hp { background: var(--danger); box-shadow: 0 0 2px var(--danger); }
    .bar-fill-charge { background: var(--accent); box-shadow: 0 0 2px var(--accent); }

    .cond-tag {
      display: inline-block; padding: 1px 4px; font-size: 8px;
      border: 1px solid; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .cond-burning { border-color: var(--warning); color: var(--warning); }
    .cond-jammed { border-color: var(--danger); color: var(--danger); }
    .cond-marked { border-color: #e8d23a; color: #e8d23a; }
  </style>
</head>
<body>
  <div class="portrait-frame">
    <div class="crt-grille"></div>
    <div class="crt-vignette"></div>
    <div class="crt-tracking"></div>
    <div class="crt-scanlines"></div>
    <div class="crt-grain"></div>
    <div class="crt-border"></div>
    <div class="crt-flash"></div>
    <div class="crt-glitch-bars" id="glitch-bars"></div>
    <div class="crt-noise-lines" id="noise-lines"></div>
    <div class="crt-vhs" id="vhs-event"></div>

    <div class="relative z-10 flex flex-col h-full">
      <!-- Status Strip (combat variant) -->
      <div class="panel flex items-center justify-between px-3 py-2" style="border-left:0;border-right:0;border-top:0; gap: 8px;">
        <div class="flex flex-col">
          <div class="text-[9px] uppercase tracking-wider" style="color: var(--text-secondary);">Depth</div>
          <div class="text-sm font-bold accent-text glow-strong leading-none">07</div>
        </div>
        <div class="flex flex-col">
          <div class="text-[9px] uppercase tracking-wider" style="color: var(--text-secondary);">Round</div>
          <div class="text-sm font-bold accent-text glow-strong leading-none">03</div>
        </div>
        <div class="flex flex-col">
          <div class="text-[9px] uppercase tracking-wider" style="color: var(--text-secondary);">Seed</div>
          <div class="text-[9px] accent-text glow">A4F2·9C1E</div>
        </div>
      </div>

      <!-- Initiative rail -->
      <div class="panel" style="border-left:0;border-right:0;">
        <div class="text-[8px] uppercase tracking-wider px-3 pt-1.5 glow" style="color: var(--text-dim);">◈ Initiative Order</div>
        <div class="init-rail">
          <div class="init-slot active">
            <div class="init-sigil player">B</div>
            <div style="color: var(--accent);">1</div>
          </div>
          <div class="init-slot enemy">
            <div class="init-sigil enemy">D</div>
            <div style="color: var(--danger);">2</div>
          </div>
          <div class="init-slot">
            <div class="init-sigil player">G</div>
            <div style="color: var(--text-secondary);">3</div>
          </div>
          <div class="init-slot enemy">
            <div class="init-sigil enemy">W</div>
            <div style="color: var(--danger);">4</div>
          </div>
          <div class="init-slot enemy">
            <div class="init-sigil enemy">D</div>
            <div style="color: var(--danger);">5</div>
          </div>
          <div class="init-slot enemy" style="opacity:0.3">
            <div class="init-sigil enemy" style="opacity:0.4">D</div>
            <div style="color: var(--text-dim);">✕</div>
          </div>
        </div>
      </div>

      <!-- Combat grid 8×16 -->
      <div class="combat-grid" id="grid"></div>

      <!-- Console -->
      <div class="console-bar">
        <div class="flex">
          <a href="exploration.html" class="mode-tab" style="text-decoration:none;">MOVE</a>
          <a href="combat.html" class="mode-tab active" style="text-decoration:none;">CMBT</a>
          <a href="console-party.html" class="mode-tab" style="text-decoration:none;">PARTY</a>
          <a href="console-gear.html" class="mode-tab" style="text-decoration:none;">GEAR</a>
          <a href="console-tech.html" class="mode-tab" style="text-decoration:none;">TECH</a>
          <div class="mode-tab disabled">LOOT</div>
          <a href="console-log.html" class="mode-tab" style="text-decoration:none;">LOG</a>
        </div>

        <div class="px-3 py-2 panel-elevated" style="background: var(--bg-panel-elevated); border-top: 1px solid var(--accent); box-shadow: inset 0 -2px 8px rgba(126,200,227,0.1);">
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-2">
              <div style="width:20px;height:20px;border:1px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:var(--accent);box-shadow:0 0 4px var(--accent);">B</div>
              <div class="text-[11px] accent-text font-bold glow">BREACHER ◈ Active</div>
            </div>
            <div class="text-[9px]" style="color: var(--text-dim);">2 AP · 1 MV</div>
          </div>
          <div class="flex gap-3 items-center text-[9px]">
            <span style="color: var(--danger);">HP 24/36</span>
            <div class="bar-track flex-1"><div class="bar-fill bar-fill-hp" style="width: 67%;"></div></div>
            <span style="color: var(--accent);">CHG 0/9</span>
          </div>
          <div class="flex gap-1 mt-1">
            <span class="cond-tag cond-burning">BURNING ×2</span>
          </div>
        </div>

        <div class="px-3 py-2">
          <div class="text-[9px] uppercase tracking-wider mb-1.5 glow" style="color: var(--text-dim);">◈ Target: Drone (14,10) · Range: Short 1-4 · Cover: None</div>
          <div class="grid grid-cols-4 gap-1.5">
            <button class="action-btn selected">ATTACK<span class="action-cost">1 AP</span></button>
            <button class="action-btn">CAST<span class="action-cost">1 AP · 2 CHG</span></button>
            <button class="action-btn">ITEM<span class="action-cost">1 AP</span></button>
            <button class="action-btn danger">RETREAT<span class="action-cost">1 AP</span></button>
          </div>
          <div class="flex justify-between mt-2 text-[9px]" style="color: var(--text-dim);">
            <span>◆ TARGET: Drone — d10 + MGT mod vs DEF 11</span>
            <button class="text-[10px] accent-text glow" style="background:none;border:1px solid var(--accent);padding:2px 12px;cursor:pointer;box-shadow:0 0 8px var(--accent);" onclick="window.location.href='scorecard.html'">◈ CONFIRM</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ═══ CRT GLITCH SYSTEM ═══
    const safePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789░▒▓█▀▄';
    const glitchBarsEl = document.getElementById('glitch-bars');
    function scheduleGlitchBar() {
      const delay = 350 + Math.random() * 649;
      setTimeout(() => {
        if (Math.random() < 0.40) {
          const bar = document.createElement('div');
          bar.className = 'glitch-bar';
          bar.style.cssText = `top: ${Math.random()*100}%; height: ${1+Math.floor(Math.random()*4)}px; opacity: ${0.1+Math.random()*0.4}; transform: translateX(${-8+Math.floor(Math.random()*17)}px);`;
          glitchBarsEl.appendChild(bar);
          setTimeout(() => bar.remove(), 80 + Math.random() * 169);
        }
        scheduleGlitchBar();
      }, delay);
    }
    scheduleGlitchBar();

    const noiseLinesEl = document.getElementById('noise-lines');
    function scheduleNoiseLine() {
      const delay = 1200 + Math.random() * 2299;
      setTimeout(() => {
        if (Math.random() < 0.30) {
          const line = document.createElement('div');
          line.className = 'noise-line';
          let noise = '';
          for (let i = 0; i < (8+Math.floor(Math.random()*21))*4; i++) noise += safePool[Math.floor(Math.random() * safePool.length)];
          line.style.cssText = `top: ${Math.random()*100}%;`;
          line.textContent = noise;
          noiseLinesEl.appendChild(line);
          setTimeout(() => line.remove(), 80 + Math.random() * 219);
        }
        scheduleNoiseLine();
      }, delay);
    }
    scheduleNoiseLine();

    const vhsEl = document.getElementById('vhs-event');
    function scheduleVHSEvent() {
      const delay = 4000 + Math.random() * 5999;
      setTimeout(() => {
        vhsEl.classList.add('active');
        setTimeout(() => vhsEl.classList.remove('active'), 80 + Math.random() * 169);
        scheduleVHSEvent();
      }, delay);
    }
    scheduleVHSEvent();

    // PER-ELEMENT TEXT GLITCH (FR-23)
    const glitchSafePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789░▒▓█▀▄■□';
    function initTextGlitch() {
      const sels = ['.glow','.glow-strong','.accent-text','.mode-tab','.init-slot'];
      const seen = new Set();
      sels.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          if (seen.has(el)) return; seen.add(el);
          const text = el.textContent.trim();
          if (text.length < 2 || text.length > 40) return;
          if (el.closest('button,.action-btn')) return;
          let intensity = 0.06;
          if (el.classList.contains('glow-strong')) intensity = 0.20;
          else if (el.classList.contains('accent-text')) intensity = 0.10;
          else if (el.classList.contains('mode-tab')) intensity = 0.08;
          else if (el.classList.contains('init-slot')) intensity = 0.05;
          el.dataset.glitch = intensity;
          const heartbeat = 700 + Math.random() * 1099;
          function tick() {
            setTimeout(() => {
              if (el.offsetParent !== null && Math.random() < parseFloat(el.dataset.glitch)) doTextSwap(el);
              tick();
            }, heartbeat);
          }
          tick();
        });
      });
    }
    function doTextSwap(el) {
      const orig = el.textContent;
      if (orig.length < 1) return;
      const numSwaps = Math.min(orig.length, 1 + Math.floor(Math.random() * 2));
      const positions = [];
      while (positions.length < numSwaps && positions.length < orig.length) {
        const pos = Math.floor(Math.random() * orig.length);
        if (!positions.includes(pos)) positions.push(pos);
      }
      const chars = orig.split('');
      positions.forEach(pos => { chars[pos] = glitchSafePool[Math.floor(Math.random() * glitchSafePool.length)]; });
      el.textContent = chars.join('');
      el.dataset.ghostText = chars.join('');
      el.classList.add('text-swapping');
      el.style.transform = `translate(${-3 + Math.floor(Math.random() * 7)}px, ${-1 + Math.floor(Math.random() * 3)}px)`;
      setTimeout(() => {
        el.textContent = orig; el.classList.remove('text-swapping'); el.style.transform = ''; delete el.dataset.ghostText;
      }, 120 + Math.random() * 229);
    }
    initTextGlitch();

    // ═══ COMBAT GRID ═══
    const grid = document.getElementById('grid');
    const gcols = 8, grows = 16;
    const walls = new Set();
    for (let c = 0; c < gcols; c++) { walls.add(`${c},0`); walls.add(`${c},${grows-1}`); }
    for (let r = 0; r < grows; r++) { walls.add(`0,${r}`); walls.add(`${gcols-1},${r}`); }
    [[2,4],[3,4],[2,5],[5,8],[5,9],[4,9],[3,12],[4,12]].forEach(([c,r]) => walls.add(`${c},${r}`));

    const players = { 3: 13, 5: 13 };
    const enemies = { 3: 3, 5: 2, 4: 5 };
    const targeted = { 4: 5 };
    const activePlayer = 3;

    for (let r = 0; r < grows; r++) {
      for (let c = 0; c < gcols; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        const isWall = walls.has(`${c},${r}`);
        if (isWall) cell.classList.add('wall');
        else cell.classList.add('floor');
        if (!isWall && ((c === 5 && r === 8) || (c === 4 && r === 9))) cell.classList.add('cover');
        if (players[c] === r) {
          cell.innerHTML = `<div class="token token-player ${c === activePlayer ? 'active' : ''}">B</div>`;
        }
        if (enemies[c] === r) {
          cell.classList.add('target-highlight');
          cell.innerHTML = `<div class="token token-enemy ${targeted[c] === r ? 'targeted' : ''}">D</div>`;
        }
        if (!isWall && Math.abs(r - 13) <= 4 && c >= 2 && c <= 6) cell.classList.add('range-valid');
        grid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
