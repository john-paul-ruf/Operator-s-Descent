<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial (Wide) — Operator's Descent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       WIDE SHELL BLOCK — byte-identical across every mocks/wide/*.html file.
       Do NOT edit per-file. Copy verbatim from mocks/wide/exploration.html.
       (Keystone — SESSION-02.)
       ═══════════════════════════════════════════════════════════════════════════ */

    :root {
      --accent: #7ec8e3;
      --accent-dim: rgba(126,200,227,0.25);
      --accent-faint: rgba(126,200,227,0.06);
      --bg-base: #0a0612;
      --bg-panel: #13092a;
      --bg-panel-elevated: #1a0e36;
      --border-dim: #2a1a4a;
      --text-primary: #e0d8f0;
      --text-secondary: #8a7aa8;
      --text-dim: #5a4a78;
      --danger: #e83a3a;
      --heal: #3ae8a8;
      --wall-color: #2a1048;
      --wall-highlight: #4a2090;
      --floor-color: #14092e;
      --floor-visited: #0c061a;
    }

    /* Wide-scope extras — do NOT edit :root above (byte-shared with portrait). */
    body {
      --warning: #e8632a;
      --border-active: var(--accent);
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: ui-monospace, 'SF Mono', 'Roboto Mono', Consolas, monospace;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ═══ FULL-VIEWPORT CRT / VHS EFFECT SYSTEM (per FR-23 timing constants) ═══ */

    .crt-scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 1px,
        rgba(255,255,255,0.10) 1px, rgba(255,255,255,0.10) 2px);
      animation: scanline-drift 4s linear infinite;
    }
    @keyframes scanline-drift {
      0% { transform: translateY(0); }
      100% { transform: translateY(2px); }
    }

    .crt-grille {
      position: fixed; inset: 0; pointer-events: none; z-index: 59;
      background: repeating-linear-gradient(to right,
        rgba(255,0,0,0.50) 0, rgba(255,0,0,0.50) 1px,
        rgba(0,255,0,0.50) 1px, rgba(0,255,0,0.50) 2px,
        rgba(0,0,255,0.50) 2px, rgba(0,0,255,0.50) 3px);
      mix-blend-mode: screen;
      opacity: 0.15;
    }

    .crt-vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 58;
      background: radial-gradient(ellipse at center,
        transparent 30%, rgba(0,0,0,0.65) 100%);
      animation: vignette-pulse 4s ease-in-out infinite;
    }
    @keyframes vignette-pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.92; }
    }

    .crt-tracking {
      position: fixed; left: 0; right: 0; height: 28%; z-index: 57;
      pointer-events: none;
      background: rgba(126,200,227,0.05);
      mix-blend-mode: screen;
      animation: tracking-loop 7s linear infinite;
    }
    @keyframes tracking-loop {
      0% { top: -28%; }
      100% { top: 100%; }
    }

    .crt-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 56;
      opacity: 0.5;
      background-image:
        radial-gradient(circle at 3% 7%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 17% 13%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 31% 3%, rgba(255,255,255,0.18) 0.5px, transparent 1px),
        radial-gradient(circle at 43% 19%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 57% 7%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 71% 23%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 83% 11%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 91% 29%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 7% 37%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 21% 43%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 37% 31%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 51% 47%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 63% 41%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 77% 37%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 89% 49%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 11% 61%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 27% 53%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 41% 67%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 53% 59%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 67% 73%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 79% 61%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 93% 71%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 5% 83%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 19% 79%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 33% 91%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 47% 83%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 61% 89%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 73% 81%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 87% 93%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 97% 87%, rgba(255,255,255,0.12) 0.5px, transparent 1px);
      background-size: 100% 100%;
      animation: grain-rescatter 1s steps(4) infinite;
    }
    @keyframes grain-rescatter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(1px, -2px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(2px, 1px); }
    }

    .crt-border {
      position: fixed; inset: 0; pointer-events: none; z-index: 55;
      box-shadow:
        inset 0 0 3px rgba(126,200,227,0.3),
        inset 0 0 8px rgba(126,200,227,0.15),
        inset 0 0 20px rgba(0,0,0,0.4);
      animation: border-flicker 0.8s steps(1) infinite;
    }
    @keyframes border-flicker {
      0% { opacity: 0.7; }
      35% { opacity: 0.7; }
      36% { opacity: 0.5; }
      42% { opacity: 0.9; }
      50% { opacity: 0.6; }
      55% { opacity: 0.8; }
      100% { opacity: 0.7; }
    }

    .crt-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 62;
      background: rgba(208,38,212,0.05);
      opacity: 0;
      animation: frame-flash 3.2s steps(1) infinite;
    }
    @keyframes frame-flash {
      0%, 85% { opacity: 0; }
      86% { opacity: 0.05; }
      88% { opacity: 0; }
      100% { opacity: 0; }
    }

    .crt-glitch-bars { position: fixed; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .glitch-bar { position: absolute; left: 0; right: 0; background: rgba(126,200,227,0.3); mix-blend-mode: screen; }

    .crt-noise-lines { position: fixed; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .noise-line {
      position: absolute; left: 0; right: 0;
      font-family: monospace; font-size: 8px;
      color: rgba(126,200,227,0.4);
      white-space: nowrap; overflow: hidden;
      letter-spacing: 1px; line-height: 10px;
      mix-blend-mode: screen;
    }

    .crt-vhs { position: fixed; inset: 0; pointer-events: none; z-index: 61; opacity: 0; overflow: hidden; }
    .crt-vhs.active { animation: vhs-event 0.2s steps(1); }
    @keyframes vhs-event {
      0% { opacity: 0; }
      20% { opacity: 1; transform: translateX(3px); }
      40% { opacity: 0.8; transform: translateX(-4px); }
      60% { opacity: 1; transform: translateX(2px); }
      80% { opacity: 0.5; transform: translateX(-1px); }
      100% { opacity: 0; transform: translateX(0); }
    }
    .crt-vhs::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right,
        rgba(255,0,0,0.08) 0%, transparent 3%,
        rgba(0,0,255,0.08) 97%, transparent 100%);
    }
    .crt-vhs::after {
      content: ''; position: absolute; left: 0; right: 0; top: 30%;
      height: 4px; background: rgba(255,255,255,0.15);
      mix-blend-mode: screen;
    }

    /* ═══ PER-ELEMENT TEXT GLITCH (FR-23) ═══ */
    [data-glitch] { position: relative; }
    [data-glitch].text-swapping::before,
    [data-glitch].text-swapping::after {
      content: attr(data-ghost-text);
      position: absolute; top: 0; left: 0; width: 100%;
      pointer-events: none;
      text-shadow: none;
    }
    [data-glitch].text-swapping::before { color: rgba(255, 0, 0, 0.47); transform: translate(-2px, 0); }
    [data-glitch].text-swapping::after  { color: rgba(0, 0, 255, 0.47); transform: translate( 2px, 0); }

    /* ═══ SHARED UTILITIES ═══ */
    .glow { text-shadow: 0 0 8px var(--accent); }
    .glow-strong { text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent); }
    .accent-text { color: var(--accent); }
    .panel { background: var(--bg-panel); border: 1px solid var(--border-dim); }
    .panel-elevated { background: var(--bg-panel-elevated); border: 1px solid var(--border-dim); }
    .btn-crt {
      background: var(--bg-panel); border: 1px solid var(--border-dim); color: var(--text-primary);
      padding: 14px 20px; font-family: inherit; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.1em;
      cursor: pointer; transition: all 0.15s ease; text-align: center; min-height: 48px;
    }
    .btn-crt:hover { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); color: var(--accent); }
    .btn-crt.primary { border-color: var(--accent); color: var(--accent); background: rgba(126,200,227,0.1); box-shadow: 0 0 4px var(--accent); }
    .btn-crt:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-link { text-decoration: none; display: inline-block; }
    .scroll-area {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-panel);
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--accent); }
    .scroll-area::-webkit-scrollbar-track { background: var(--bg-panel); }

    /* ═══════════════════════════════════════════════════════════════════════════
       END WIDE SHELL BLOCK
       ═══════════════════════════════════════════════════════════════════════════ */

    /* ═══ TUTORIAL-SPECIFIC (WIDE TWO-PAGE SPREAD) ═══ */

    /* Per spec §Screen Layouts by Class row 14:
       "two-page spread — current page on the left (illustration + body), next page on the
       right (illustration + body) so the reader sees the transition. Prev/next advances
       both panes by two; page dots reflect the leftmost page. At the last page the right
       pane shows a 'Return to title' summary card." */
    .wide-tutorial-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100vw; height: 100vh;
      z-index: 10;
    }
    .wide-tutorial-header {
      padding: 18px 28px;
      background: var(--bg-panel-elevated);
      border-bottom: 1px solid var(--accent);
      text-align: center;
    }
    .wide-tutorial-spread {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px 28px;
      overflow: hidden;
      min-height: 0;
    }
    .wide-tutorial-pane {
      display: flex; flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      overflow: hidden;
      min-height: 0;
    }
    .wide-tutorial-pane-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-panel-elevated);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--accent); text-shadow: 0 0 8px var(--accent);
    }
    .wide-tutorial-pane-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
    }
    .wide-tutorial-footer {
      padding: 14px 28px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-dim);
      display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    .page { display: none; }
    .page.active { display: block; }
    .page-dot {
      width: 10px; height: 10px; border: 1px solid var(--border-dim); border-radius: 0;
      display: inline-block; transition: all 0.2s ease;
    }
    .page-dot.active {
      background: var(--accent); border-color: var(--accent);
      box-shadow: 0 0 4px var(--accent);
    }
    /* Mini illustration components — inherited from portrait tutorial. */
    .illus {
      background: var(--bg-base); border: 1px solid var(--border-dim);
      padding: 16px; margin: 12px 0; text-align: center; min-height: 120px;
      display: flex; align-items: center; justify-content: center;
    }
    .illus-console { background: var(--bg-panel); border: 1px solid var(--accent); padding: 8px; font-size: 9px; color: var(--accent); text-shadow: 0 0 4px var(--accent); }
    .illus-dpad { display: grid; grid-template-columns: repeat(3, 28px); grid-template-rows: repeat(3, 28px); gap: 2px; margin: 0 auto; }
    .illus-dpad > div { background: var(--bg-panel-elevated); border: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent); }
    .illus-dpad-center { background: transparent !important; border: 1px dashed var(--border-dim) !important; font-size: 7px !important; color: var(--text-dim) !important; }
    .illus-grid { display: grid; grid-template-columns: repeat(6, 20px); grid-template-rows: repeat(4, 20px); gap: 0; margin: 0 auto; }
    .illus-grid > div { border: 1px solid rgba(42,26,74,0.5); font-size: 8px; display: flex; align-items: center; justify-content: center; }
    .illus-grid > div.wall { background: #0d0418; }
    .illus-grid > div.player { background: rgba(126,200,227,0.2); color: var(--accent); }
    .illus-grid > div.enemy { background: rgba(232,58,58,0.2); color: var(--danger); }
    .illus-tabs { display: flex; gap: 2px; }
    .illus-tab { flex: 1; padding: 5px; text-align: center; font-size: 8px; border: 1px solid var(--border-dim); color: var(--text-secondary); }
    .illus-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(126,200,227,0.1); }

    /* Return-to-title summary card — appears in the right pane at the closing state. */
    .wide-tutorial-summary {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 32px 24px;
      gap: 16px;
    }
    .wide-tutorial-summary .badge {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em;
      color: var(--text-dim);
    }
    .wide-tutorial-summary .headline {
      font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--accent); text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
    }
    .wide-tutorial-summary .copy {
      font-size: 11px; color: var(--text-secondary); line-height: 1.6;
      max-width: 340px;
    }
  </style>
</head>
<body>
  <!-- ═══ FULL-VIEWPORT CRT EFFECT LAYERS ═══ -->
  <div class="crt-grille"></div>
  <div class="crt-vignette"></div>
  <div class="crt-tracking"></div>
  <div class="crt-scanlines"></div>
  <div class="crt-grain"></div>
  <div class="crt-border"></div>
  <div class="crt-flash"></div>
  <div class="crt-glitch-bars" id="glitch-bars"></div>
  <div class="crt-noise-lines" id="noise-lines"></div>
  <div class="crt-vhs" id="vhs-event"></div>

  <!-- ═══ TWO-PAGE SPREAD SHELL ═══ -->
  <div class="wide-tutorial-shell">

    <div class="wide-tutorial-header">
      <div class="text-[10px] uppercase tracking-wider" style="color: var(--text-secondary);">◈ Operator's Manual</div>
      <div class="text-base accent-text glow-strong" id="spread-title">THE CONSOLE — MOVE MODE</div>
    </div>

    <div class="wide-tutorial-spread">

      <!-- LEFT PANE -->
      <div class="wide-tutorial-pane" id="pane-left">
        <div class="wide-tutorial-pane-header" id="pane-left-title">◈ Page 1</div>
        <div class="wide-tutorial-pane-body scroll-area" id="pane-left-body">
          <!-- Populated by JS on state change -->
        </div>
      </div>

      <!-- RIGHT PANE -->
      <div class="wide-tutorial-pane" id="pane-right">
        <div class="wide-tutorial-pane-header" id="pane-right-title">◈ Page 2</div>
        <div class="wide-tutorial-pane-body scroll-area" id="pane-right-body">
          <!-- Populated by JS on state change -->
        </div>
      </div>

    </div>

    <div class="wide-tutorial-footer">
      <div class="flex items-center justify-center gap-2">
        <div class="page-dot active" id="dot-1"></div>
        <div class="page-dot" id="dot-2"></div>
        <div class="page-dot" id="dot-3"></div>
        <div class="page-dot" id="dot-4"></div>
        <div class="page-dot" id="dot-5"></div>
        <div class="page-dot" id="dot-6"></div>
      </div>
      <div class="flex gap-2" style="min-width: 360px;">
        <button class="btn-crt flex-1" id="prev-btn" disabled onclick="changeSpread(-1)">◀ PREV</button>
        <button class="btn-crt primary flex-1" id="next-btn" onclick="changeSpread(1)">NEXT ▶</button>
      </div>
      <a href="title.html" class="btn-crt btn-link" style="min-width: 360px;">SKIP / BACK TO TITLE</a>
    </div>

  </div>

  <!-- Hidden page content — cloned into panes by JS. All 6 pages preserved from portrait. -->
  <template id="tpl-pages">
    <!-- Page 1: Console Overview -->
    <div class="page-content" data-page="1" data-title="THE CONSOLE">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ The Single Console</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p>Every action in Operator's Descent routes through <span class="accent-text">one console</span> pinned to the bottom of the screen.</p>
        <p>No context menus. No floating panels. No map-tapping. The playfield is a <span class="accent-text">readout</span>, not a control surface.</p>
        <p>The console has <span class="accent-text">seven mutually exclusive modes</span>:</p>
      </div>
      <div class="illus">
        <div class="illus-tabs" style="width: 100%;">
          <div class="illus-tab active">MOVE</div>
          <div class="illus-tab">CMBT</div>
          <div class="illus-tab">PARTY</div>
          <div class="illus-tab">GEAR</div>
          <div class="illus-tab">TECH</div>
          <div class="illus-tab">LOOT</div>
          <div class="illus-tab">LOG</div>
        </div>
      </div>
      <div class="text-[10px] space-y-1" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">MOVE</span> — Explore the floor, 8-way movement</p>
        <p><span class="accent-text">CMBT</span> — Issue combat commands during encounters</p>
        <p><span class="accent-text">PARTY</span> — Inspect party stats, HP, CHARGE, conditions</p>
        <p><span class="accent-text">GEAR</span> — Equip/unequip items, manage inventory</p>
        <p><span class="accent-text">TECH</span> — Cast protocols, manage CHARGE, overclock</p>
        <p><span class="accent-text">LOOT</span> — Open containers, take items</p>
        <p><span class="accent-text">LOG</span> — Review recent events, copy share link</p>
      </div>
      <div class="text-[10px] mt-3" style="color: var(--text-dim);">
        ◈ Tap a mode tab to switch. In wide layout the console dock stays expanded at the right of the shell.
      </div>
    </div>

    <!-- Page 2: MOVE Mode -->
    <div class="page-content" data-page="2" data-title="MOVE MODE">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ MOVE Mode</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p>Move your party through the floor using the directional pad. <span class="accent-text">Eight-way movement</span> with a corner rule — you cannot move diagonally past a blocked corner.</p>
      </div>
      <div class="illus">
        <div class="illus-dpad">
          <div>↖</div><div>↑</div><div>↗</div>
          <div>←</div><div class="illus-dpad-center">WAIT</div><div>→</div>
          <div>↙</div><div>↓</div><div>↘</div>
        </div>
      </div>
      <div class="text-[10px] space-y-1" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">Keyboard:</span> Arrow keys, Numpad, or WASD</p>
        <p><span class="accent-text">Touch:</span> Tap directional buttons</p>
        <p><span class="accent-text">Auto-stop:</span> Movement halts when a hostile enters line of sight, a container or descent point is discovered, or the party takes damage.</p>
        <p><span class="accent-text">Fog of war:</span> Unvisited cells are dark. Visited cells dim. In-LOS cells are visible. Line of sight uses shadowcast.</p>
      </div>
    </div>

    <!-- Page 3: COMBAT Mode -->
    <div class="page-content" data-page="3" data-title="COMBAT MODE">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ COMBAT Mode</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p>When contact is made, the view zooms to an <span class="accent-text">8×16 grid</span> at the contact point. The floor geometry becomes the arena.</p>
        <p>Combat is turn-based with <span class="accent-text">initiative order</span>. Each character gets <span class="accent-text">one move action + 2 AP</span> per turn.</p>
      </div>
      <div class="illus">
        <div class="illus-grid">
          <div class="wall"></div><div></div><div></div><div class="enemy">D</div><div></div><div class="wall"></div>
          <div class="wall"></div><div></div><div></div><div></div><div></div><div class="wall"></div>
          <div></div><div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div class="player">B</div><div></div><div class="player">G</div><div></div>
        </div>
      </div>
      <div class="text-[10px] space-y-1" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">AP cost:</span> Attack 1 AP · Cast protocol 1 AP · Item 1 AP · Overclock 1 AP · Retreat 1 AP</p>
        <p><span class="accent-text">Free actions:</span> Weapon swap (once/turn) · Class signature</p>
        <p><span class="accent-text">Targeting:</span> Tap a target, then confirm. Keyboard: Tab to cycle, Enter to confirm.</p>
        <p><span class="accent-text">Range bands:</span> Adjacent (1) · Short (1-4) · Medium (1-8) · Long (3-16) · Blast (AoE)</p>
        <p><span class="accent-text">Cover:</span> Determined by edge-crossing between attacker and target.</p>
      </div>
    </div>

    <!-- Page 4: PARTY, GEAR, TECH Modes -->
    <div class="page-content" data-page="4" data-title="PARTY · GEAR · TECH">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ PARTY · GEAR · TECH</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">PARTY:</span> View each character's attributes, HP, CHARGE, conditions, class, calibration count, and corruption contribution.</p>
        <p><span class="accent-text">GEAR:</span> Equip and unequip weapons, armor, and off-hand items. CORRUPT items show a warning before equipping. Consumables are used from here (or in combat).</p>
        <p><span class="accent-text">TECH:</span> View your protocol deck. See CHARGE available and cost per protocol. Cast protocols (select target if required). Overclock for extra effect at double cost — with a corruption risk on failure.</p>
      </div>
      <div class="text-[10px] mt-3 p-3" style="background: rgba(232,99,42,0.1); border: 1px solid var(--warning); color: var(--warning);">
        ⚠ CORRUPT items are strictly stronger but permanently raise the danger clock rate. The danger clock triggers hunts — ambush encounters where the party is surrounded.
      </div>
    </div>

    <!-- Page 5: LOOT & LOG Modes -->
    <div class="page-content" data-page="5" data-title="LOOT · LOG">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ LOOT · LOG</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">LOOT:</span> Activates when adjacent to or standing on a container. Shows contents with full item details — stats, rarity, affixes, CORRUPT status. Take items individually or all at once.</p>
        <p><span class="accent-text">LOG:</span> Scrolling log of recent events — combat rolls, discoveries, damage, deaths. Every d20 roll is recorded with the attribute used, modifier, target, and outcome.</p>
        <p><span class="accent-text">Share link:</span> In LOG mode, copy your full run state to a URL under 1500 characters. Paste it on any device to resume bit-for-bit.</p>
      </div>
    </div>

    <!-- Page 6: Status Strip & Settings -->
    <div class="page-content" data-page="6" data-title="STATUS &amp; SETTINGS">
      <div class="text-[11px] uppercase tracking-wider accent-text glow mb-2">◈ Status Strip &amp; Settings</div>
      <div class="text-[11px] space-y-2" style="color: var(--text-secondary); line-height: 1.6;">
        <p><span class="accent-text">Status Strip</span> (top of screen in portrait, telemetry dock in wide): Shows depth, seed, party sigils with HP bars, and danger clock value.</p>
        <p><span class="accent-text">Accent color:</span> Each floor's environment theme sets the screen's accent color. You read where you are from the color before reading a number.</p>
        <p><span class="accent-text">Seed:</span> The world seed determines every floor, every loot roll, every encounter. The same seed always yields the same dungeon.</p>
        <p><span class="accent-text">Settings:</span> Master mute, per-layer audio volume (5 sliders), glitch toggle, reduced-motion override, scanline/grain toggle. All persist in localStorage.</p>
        <p><span class="accent-text">Depth is the score.</span> There is no win condition. A run resolves on party wipe. The depth reached is the entire result. Every tenth floor is a threshold — guaranteed elite, vault, and new theme.</p>
      </div>
      <div class="text-[10px] mt-4 p-3" style="background: rgba(126,200,227,0.05); border: 1px solid var(--accent); color: var(--accent);">
        ◈ You are now ready to descend. Press BEGIN NEW RUN from the title screen to spend your 80 points and start.
      </div>
    </div>

    <!-- Closing summary — rendered in right pane at last state. -->
    <div class="page-content" data-page="summary" data-title="RETURN TO TITLE">
      <div class="wide-tutorial-summary">
        <div class="badge">◈ ◈ ◈</div>
        <div class="headline">READY TO DESCEND</div>
        <div class="copy">
          You've seen the console, the modes, the loop. The rest is the machine's job — and yours.
        </div>
        <div class="copy" style="color: var(--text-dim);">
          Return to the title screen and press <span class="accent-text">BEGIN NEW RUN</span> when you're ready.
        </div>
        <a href="title.html" class="btn-crt primary btn-link" style="min-width: 220px; margin-top: 8px;">◈ RETURN TO TITLE</a>
      </div>
    </div>
  </template>

  <script>
    // ═══ Two-page spread state machine ═══
    // Spreads: 1=(1,2)  2=(3,4)  3=(5,6)  4=(6, summary)  — last spread hosts summary card per spec.
    const totalPages = 6;
    // Layout table: [leftPage, rightPage-or-'summary', dotToHighlight, spreadTitle]
    const spreads = [
      [1, 2, 1, 'THE CONSOLE — MOVE MODE'],
      [3, 4, 3, 'COMBAT — PARTY · GEAR · TECH'],
      [5, 6, 5, 'LOOT · LOG — STATUS & SETTINGS'],
      [6, 'summary', 6, 'READY TO DESCEND']
    ];
    const totalSpreads = spreads.length;
    let currentSpread = 1;

    function renderPage(paneBodyEl, paneHeaderEl, pageKey) {
      const tpl = document.getElementById('tpl-pages');
      const src = tpl.content.querySelector(`[data-page="${pageKey}"]`);
      paneBodyEl.innerHTML = '';
      if (src) {
        paneBodyEl.appendChild(src.cloneNode(true));
        paneHeaderEl.textContent = pageKey === 'summary'
          ? '◈ Return to Title'
          : `◈ Page ${pageKey} — ${src.getAttribute('data-title')}`;
      }
    }

    function applySpread(n) {
      const [leftKey, rightKey, dotIdx, title] = spreads[n - 1];
      renderPage(
        document.getElementById('pane-left-body'),
        document.getElementById('pane-left-title'),
        leftKey
      );
      renderPage(
        document.getElementById('pane-right-body'),
        document.getElementById('pane-right-title'),
        rightKey
      );
      document.getElementById('spread-title').textContent = title;
      // Highlight the leftmost-page dot per spec.
      for (let i = 1; i <= totalPages; i++) {
        document.getElementById('dot-' + i).classList.toggle('active', i === dotIdx);
      }
      document.getElementById('prev-btn').disabled = n === 1;
      document.getElementById('next-btn').textContent = n === totalSpreads ? '◈ DONE' : 'NEXT ▶';
      // Scroll both panes to top on spread change.
      document.getElementById('pane-left-body').scrollTop = 0;
      document.getElementById('pane-right-body').scrollTop = 0;
    }

    function changeSpread(dir) {
      // "DONE" on the last spread returns to title.
      if (dir > 0 && currentSpread === totalSpreads) {
        window.location.href = 'title.html';
        return;
      }
      const next = currentSpread + dir;
      if (next < 1 || next > totalSpreads) return;
      currentSpread = next;
      applySpread(currentSpread);
    }

    // Initial render — spread 1 (pages 1 + 2) satisfies "one populated page pair" gate.
    applySpread(1);

    // ═══════════════════════════════════════════════
    //  WIDE SHELL SCRIPT BLOCK — copy verbatim across all mocks/wide/*.html files.
    //  (CRT glitch scheduler + text-glitch + jitter + tab handler + log auto-scroll.)
    // ═══════════════════════════════════════════════

    // Safe pool for character substitution (Latin, digits, box-drawing)
    const safePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789░▒▓█▀▄';

    // — Glitch bars: 350-999ms, 40% fire, 80-249ms, 1-4px tall, ±8px offset, alpha 0.1-0.5 —
    const glitchBarsEl = document.getElementById('glitch-bars');
    function scheduleGlitchBar() {
      const delay = 350 + Math.random() * 649;
      setTimeout(() => {
        if (Math.random() < 0.40) {
          const bar = document.createElement('div');
          bar.className = 'glitch-bar';
          const height = 1 + Math.floor(Math.random() * 4);
          const offset = -8 + Math.floor(Math.random() * 17);
          const alpha = 0.1 + Math.random() * 0.4;
          const top = Math.random() * 100;
          bar.style.cssText = `top: ${top}%; height: ${height}px; opacity: ${alpha}; transform: translateX(${offset}px);`;
          glitchBarsEl.appendChild(bar);
          setTimeout(() => bar.remove(), 80 + Math.random() * 169);
        }
        scheduleGlitchBar();
      }, delay);
    }
    scheduleGlitchBar();

    // — Noise lines: 1200-3499ms, 30% fire, 80-299ms —
    const noiseLinesEl = document.getElementById('noise-lines');
    function scheduleNoiseLine() {
      const delay = 1200 + Math.random() * 2299;
      setTimeout(() => {
        if (Math.random() < 0.30) {
          const line = document.createElement('div');
          line.className = 'noise-line';
          const charCount = 8 + Math.floor(Math.random() * 21);
          let noise = '';
          for (let i = 0; i < charCount * 4; i++) noise += safePool[Math.floor(Math.random() * safePool.length)];
          const top = Math.random() * 100;
          line.style.cssText = `top: ${top}%;`;
          line.textContent = noise;
          noiseLinesEl.appendChild(line);
          setTimeout(() => line.remove(), 80 + Math.random() * 219);
        }
        scheduleNoiseLine();
      }, delay);
    }
    scheduleNoiseLine();

    // — VHS events: 4000-9999ms, 80-249ms —
    const vhsEl = document.getElementById('vhs-event');
    function scheduleVHSEvent() {
      const delay = 4000 + Math.random() * 5999;
      setTimeout(() => {
        vhsEl.classList.add('active');
        setTimeout(() => vhsEl.classList.remove('active'), 80 + Math.random() * 169);
        scheduleVHSEvent();
      }, delay);
    }
    scheduleVHSEvent();

    // — Per-element text glitch (FR-23): character substitution + chromatic ghosts —
    const glitchSafePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789░▒▓█▀▄■□';
    function initTextGlitch() {
      const sels = ['.glow','.glow-strong','.accent-text','.chroma-text'];
      const seen = new Set();
      sels.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          if (seen.has(el)) return; seen.add(el);
          const text = el.textContent.trim();
          if (text.length < 2 || text.length > 40) return;
          if (el.closest('button,.dpad-btn,.action-btn,.stepper-btn')) return;
          let intensity = 0.06;
          if (el.classList.contains('glow-strong') || el.classList.contains('chroma-text')) intensity = 0.20;
          else if (el.classList.contains('accent-text')) intensity = 0.10;
          el.dataset.glitch = intensity;
          const heartbeat = 700 + Math.random() * 1099;
          function tick() {
            setTimeout(() => {
              if (el.offsetParent !== null && Math.random() < parseFloat(el.dataset.glitch)) doTextSwap(el);
              tick();
            }, heartbeat);
          }
          tick();
        });
      });
    }
    function doTextSwap(el) {
      const orig = el.textContent;
      if (orig.length < 1) return;
      const numSwaps = Math.min(orig.length, 1 + Math.floor(Math.random() * 2));
      const positions = [];
      while (positions.length < numSwaps && positions.length < orig.length) {
        const pos = Math.floor(Math.random() * orig.length);
        if (!positions.includes(pos)) positions.push(pos);
      }
      const chars = orig.split('');
      positions.forEach(pos => { chars[pos] = glitchSafePool[Math.floor(Math.random() * glitchSafePool.length)]; });
      el.textContent = chars.join('');
      el.dataset.ghostText = chars.join('');
      el.classList.add('text-swapping');
      el.style.transform = `translate(${-3 + Math.floor(Math.random() * 7)}px, ${-1 + Math.floor(Math.random() * 3)}px)`;
      setTimeout(() => {
        el.textContent = orig;
        el.classList.remove('text-swapping');
        el.style.transform = '';
        delete el.dataset.ghostText;
      }, 120 + Math.random() * 229);
    }
    initTextGlitch();

    // ═══════════════════════════════════════════════
    //  END WIDE SHELL SCRIPT BLOCK
    // ═══════════════════════════════════════════════
  </script>
</body>
