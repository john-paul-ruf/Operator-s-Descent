<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title Screen (Wide) — Operator's Descent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       WIDE SHELL BLOCK — byte-identical across every mocks/wide/*.html file.
       Do NOT edit per-file. Copy verbatim from mocks/wide/exploration.html.
       (Keystone — SESSION-02.)
       ═══════════════════════════════════════════════════════════════════════════ */

    :root {
      --accent: #7ec8e3;
      --accent-dim: rgba(126,200,227,0.25);
      --accent-faint: rgba(126,200,227,0.06);
      --bg-base: #0a0612;
      --bg-panel: #13092a;
      --bg-panel-elevated: #1a0e36;
      --border-dim: #2a1a4a;
      --text-primary: #e0d8f0;
      --text-secondary: #8a7aa8;
      --text-dim: #5a4a78;
      --danger: #e83a3a;
      --heal: #3ae8a8;
      --wall-color: #2a1048;
      --wall-highlight: #4a2090;
      --floor-color: #14092e;
      --floor-visited: #0c061a;
    }

    /* Wide-scope extras — do NOT edit :root above (byte-shared with portrait). */
    body {
      --warning: #e8632a;
      --border-active: var(--accent);
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: ui-monospace, 'SF Mono', 'Roboto Mono', Consolas, monospace;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ═══ FULL-VIEWPORT CRT / VHS EFFECT SYSTEM (per FR-23 timing constants) ═══ */

    .crt-scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 1px,
        rgba(255,255,255,0.10) 1px, rgba(255,255,255,0.10) 2px);
      animation: scanline-drift 4s linear infinite;
    }
    @keyframes scanline-drift {
      0% { transform: translateY(0); }
      100% { transform: translateY(2px); }
    }

    .crt-grille {
      position: fixed; inset: 0; pointer-events: none; z-index: 59;
      background: repeating-linear-gradient(to right,
        rgba(255,0,0,0.50) 0, rgba(255,0,0,0.50) 1px,
        rgba(0,255,0,0.50) 1px, rgba(0,255,0,0.50) 2px,
        rgba(0,0,255,0.50) 2px, rgba(0,0,255,0.50) 3px);
      mix-blend-mode: screen;
      opacity: 0.15;
    }

    .crt-vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 58;
      background: radial-gradient(ellipse at center,
        transparent 30%, rgba(0,0,0,0.65) 100%);
      animation: vignette-pulse 4s ease-in-out infinite;
    }
    @keyframes vignette-pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.92; }
    }

    .crt-tracking {
      position: fixed; left: 0; right: 0; height: 28%; z-index: 57;
      pointer-events: none;
      background: rgba(126,200,227,0.05);
      mix-blend-mode: screen;
      animation: tracking-loop 7s linear infinite;
    }
    @keyframes tracking-loop {
      0% { top: -28%; }
      100% { top: 100%; }
    }

    .crt-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 56;
      opacity: 0.5;
      background-image:
        radial-gradient(circle at 3% 7%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 17% 13%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 31% 3%, rgba(255,255,255,0.18) 0.5px, transparent 1px),
        radial-gradient(circle at 43% 19%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 57% 7%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 71% 23%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 83% 11%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 91% 29%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 7% 37%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 21% 43%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 37% 31%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 51% 47%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 63% 41%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 77% 37%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 89% 49%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 11% 61%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 27% 53%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 41% 67%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 53% 59%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 67% 73%, rgba(255,255,255,0.12) 0.5px, transparent 1px),
        radial-gradient(circle at 79% 61%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 93% 71%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 5% 83%, rgba(255,255,255,0.11) 0.5px, transparent 1px),
        radial-gradient(circle at 19% 79%, rgba(255,255,255,0.15) 0.5px, transparent 1px),
        radial-gradient(circle at 33% 91%, rgba(255,255,255,0.13) 0.5px, transparent 1px),
        radial-gradient(circle at 47% 83%, rgba(255,255,255,0.17) 0.5px, transparent 1px),
        radial-gradient(circle at 61% 89%, rgba(255,255,255,0.10) 0.5px, transparent 1px),
        radial-gradient(circle at 73% 81%, rgba(255,255,255,0.14) 0.5px, transparent 1px),
        radial-gradient(circle at 87% 93%, rgba(255,255,255,0.16) 0.5px, transparent 1px),
        radial-gradient(circle at 97% 87%, rgba(255,255,255,0.12) 0.5px, transparent 1px);
      background-size: 100% 100%;
      animation: grain-rescatter 1s steps(4) infinite;
    }
    @keyframes grain-rescatter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(1px, -2px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(2px, 1px); }
    }

    .crt-border {
      position: fixed; inset: 0; pointer-events: none; z-index: 55;
      box-shadow:
        inset 0 0 3px rgba(126,200,227,0.3),
        inset 0 0 8px rgba(126,200,227,0.15),
        inset 0 0 20px rgba(0,0,0,0.4);
      animation: border-flicker 0.8s steps(1) infinite;
    }
    @keyframes border-flicker {
      0% { opacity: 0.7; }
      35% { opacity: 0.7; }
      36% { opacity: 0.5; }
      42% { opacity: 0.9; }
      50% { opacity: 0.6; }
      55% { opacity: 0.8; }
      100% { opacity: 0.7; }
    }

    .crt-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 62;
      background: rgba(208,38,212,0.05);
      opacity: 0;
      animation: frame-flash 3.2s steps(1) infinite;
    }
    @keyframes frame-flash {
      0%, 85% { opacity: 0; }
      86% { opacity: 0.05; }
      88% { opacity: 0; }
      100% { opacity: 0; }
    }

    .crt-glitch-bars { position: fixed; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .glitch-bar { position: absolute; left: 0; right: 0; background: rgba(126,200,227,0.3); mix-blend-mode: screen; }

    .crt-noise-lines { position: fixed; inset: 0; pointer-events: none; z-index: 61; overflow: hidden; }
    .noise-line {
      position: absolute; left: 0; right: 0;
      font-family: monospace; font-size: 8px;
      color: rgba(126,200,227,0.4);
      white-space: nowrap; overflow: hidden;
      letter-spacing: 1px; line-height: 10px;
      mix-blend-mode: screen;
    }

    .crt-vhs { position: fixed; inset: 0; pointer-events: none; z-index: 61; opacity: 0; overflow: hidden; }
    .crt-vhs.active { animation: vhs-event 0.2s steps(1); }
    @keyframes vhs-event {
      0% { opacity: 0; }
      20% { opacity: 1; transform: translateX(3px); }
      40% { opacity: 0.8; transform: translateX(-4px); }
      60% { opacity: 1; transform: translateX(2px); }
      80% { opacity: 0.5; transform: translateX(-1px); }
      100% { opacity: 0; transform: translateX(0); }
    }
    .crt-vhs::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right,
        rgba(255,0,0,0.08) 0%, transparent 3%,
        rgba(0,0,255,0.08) 97%, transparent 100%);
    }
    .crt-vhs::after {
      content: ''; position: absolute; left: 0; right: 0; top: 30%;
      height: 4px; background: rgba(255,255,255,0.15);
      mix-blend-mode: screen;
    }

    /* ═══ PER-ELEMENT TEXT GLITCH (FR-23) ═══ */
    [data-glitch] { position: relative; }
    [data-glitch].text-swapping::before,
    [data-glitch].text-swapping::after {
      content: attr(data-ghost-text);
      position: absolute; top: 0; left: 0; width: 100%;
      pointer-events: none;
      text-shadow: none;
    }
    [data-glitch].text-swapping::before { color: rgba(255, 0, 0, 0.47); transform: translate(-2px, 0); }
    [data-glitch].text-swapping::after  { color: rgba(0, 0, 255, 0.47); transform: translate( 2px, 0); }

    /* ═══ SHARED UTILITIES ═══ */
    .glow { text-shadow: 0 0 8px var(--accent); }
    .glow-strong { text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent); }
    .accent-text { color: var(--accent); }
    .panel { background: var(--bg-panel); border: 1px solid var(--border-dim); }
    .panel-elevated { background: var(--bg-panel-elevated); border: 1px solid var(--border-dim); }
    .bar-track { background: var(--bg-base); height: 4px; border: 1px solid var(--border-dim); }
    .bar-fill { height: 100%; background: var(--accent); box-shadow: 0 0 2px var(--accent); }
    .bar-fill-danger { background: var(--danger); box-shadow: 0 0 2px var(--danger); }
    .bar-fill-charge { background: var(--accent); box-shadow: 0 0 2px var(--accent); }
    .bar-fill-hp { background: var(--danger); box-shadow: 0 0 2px var(--danger); }
    .sigil-mini {
      width: 24px; height: 24px;
      border: 1px solid var(--accent); border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 9px; font-weight: bold;
      text-shadow: 0 0 4px var(--accent);
      box-shadow: 0 0 4px var(--accent);
    }
    .theme-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--accent-faint);
      border: 1px solid var(--accent-dim);
      color: var(--accent); border-radius: 2px;
      box-shadow: 0 0 4px var(--accent-dim);
    }
    .chroma-text { position: relative; text-shadow: 0 0 8px var(--accent); }
    .jitter-target { will-change: transform; }
    .alert-banner {
      background: rgba(232,58,58,0.15);
      border: 1px solid var(--danger);
      box-shadow: 0 0 8px var(--danger), 0 0 16px rgba(232,58,58,0.2);
    }
    .scroll-area {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-panel);
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--accent); }
    .scroll-area::-webkit-scrollbar-track { background: var(--bg-panel); }

    /* ═══ LOG ENTRY CLASSES (used by telemetry dock live-feed AND LOG mode) ═══ */
    .log-entry {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(42,26,74,0.4);
      font-size: 10px; line-height: 1.45;
    }
    .log-turn { color: var(--text-dim); font-size: 9px; margin-right: 6px; }
    .log-combat { color: var(--danger); }
    .log-discovery { color: #e8d23a; }
    .log-damage { color: var(--danger); }
    .log-death { color: var(--danger); font-weight: bold; }
    .log-heal { color: var(--heal); }
    .log-info { color: var(--accent); }
    .log-move { color: var(--text-secondary); }

    /* ═══ WIDE SHELL — three-region grid (Adaptive Layout System) ═══ */
    .wide-shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(320px, calc(100vh * 9 / 16)) minmax(360px, 1.2fr);
      grid-template-rows: 100vh;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    /* Telemetry dock (left region): stacked status fields + persistent LOG feed */
    .wide-telemetry-dock {
      display: flex; flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-dim);
      overflow: hidden;
      min-width: 0;
    }
    .wide-telemetry-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-panel-elevated);
    }
    .wide-telemetry-field {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(42,26,74,0.5);
    }
    .wide-telemetry-field:last-child { border-bottom: 0; }
    .wide-telemetry-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--text-secondary);
    }
    .wide-telemetry-value {
      font-size: 14px; color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
    }
    .wide-log-feed {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .wide-log-feed-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-panel);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--accent); text-shadow: 0 0 8px var(--accent);
      position: sticky; top: 0;
    }
    .wide-log-feed-scroll { flex: 1; }

    /* Playfield column (center region): portrait-proportioned, 9:16 anchored to viewport height */
    .wide-playfield-column {
      position: relative;
      display: flex; flex-direction: column;
      background: var(--bg-base);
      overflow: hidden;
      min-width: 0;
    }
    .wide-playfield-inner {
      flex: 1;
      display: flex; flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Console dock (right region): vertical mode tabs on inner (left) edge, content fills the rest */
    .wide-console-dock {
      display: grid;
      grid-template-columns: 96px 1fr;   /* 96px vertical tab rail = touch-target minimum */
      grid-template-rows: 100vh;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-dim);
      box-shadow: -2px 0 12px rgba(0,0,0,0.6), -1px 0 4px rgba(126,200,227,0.1);
      overflow: hidden;
      min-width: 0;
    }
    .wide-console-tabs {
      display: flex; flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-dim);
      overflow: hidden;
    }
    .wide-mode-tab {
      flex: 1;
      min-height: 96px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--text-secondary);
      cursor: pointer;
      border-left: 3px solid transparent;
      border-bottom: 1px solid rgba(42,26,74,0.5);
      text-decoration: none;
      transition: all 0.15s ease;
      writing-mode: horizontal-tb;
    }
    .wide-mode-tab:hover { color: var(--text-primary); }
    .wide-mode-tab.active {
      border-left-color: var(--accent);
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
      background: var(--accent-faint);
      box-shadow: inset 4px 0 8px rgba(126,200,227,0.1);
    }
    .wide-mode-tab.disabled { opacity: 0.3; cursor: not-allowed; }
    .wide-console-content {
      display: flex; flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: var(--bg-panel);
    }
    .wide-console-content-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-panel-elevated);
      display: flex; align-items: center; justify-content: space-between;
    }
    .wide-console-content-body {
      flex: 1;
      padding: 20px;
      display: flex; flex-direction: column;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       END WIDE SHELL BLOCK
       ═══════════════════════════════════════════════════════════════════════════ */

    /* ═══ TITLE-SPECIFIC ═══ */

    /* Centered vertical stack occupying the full viewport; ornament field widens
       with the viewport up to a generous cap so the chromatic-ghost title lockup
       has room to breathe at 1440×900 and 1920×1080 without stretching. */
    .wide-title-screen {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 48px 24px;
      box-sizing: border-box;
    }

    .wide-title-header {
      text-align: center;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-secondary);
      text-shadow: 0 0 8px var(--accent);
    }

    .wide-title-body {
      display: flex; flex-direction: column;
      align-items: center;
      gap: 48px;
      width: 100%;
    }

    .wide-title-lockup {
      text-align: center;
      width: 100%;
      max-width: 720px;
    }

    .wide-title-ornament {
      font-size: 16px;
      letter-spacing: 0.3em;
      color: var(--text-secondary);
      text-shadow: 0 0 8px var(--accent);
      margin: 0 auto;
    }
    .wide-title-ornament::before { content: '◈'; margin-right: 0.6em; }
    .wide-title-ornament::after  { content: '◈'; margin-left: 0.6em; }

    .wide-title-word {
      display: block;
      font-size: 64px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
      line-height: 1.05;
    }

    .wide-title-tagline {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
    }

    /* Chromatic-ghost title treatment (matches portrait mocks/title.html). */
    .title-glitch { position: relative; display: inline-block; }
    .title-glitch::before, .title-glitch::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0; width: 100%;
      opacity: 0.47;
      animation: chroma-ghost 3s steps(1) infinite;
    }
    .title-glitch::before { color: #ff0000; transform: translate(-2px, 0); }
    .title-glitch::after  { color: #0000ff; transform: translate( 2px, 0); }
    @keyframes chroma-ghost {
      0%, 70% { opacity: 0; }
      71% { opacity: 0.47; }
      85% { opacity: 0.47; }
      86% { opacity: 0; }
      100% { opacity: 0; }
    }

    .btn-crt {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      color: var(--text-primary);
      padding: 14px 24px;
      font-family: inherit;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      box-shadow: 0 0 4px rgba(0,0,0,0.4);
      min-height: 48px;
    }
    .btn-crt:hover, .btn-crt:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent), inset 0 0 8px rgba(126,200,227,0.1);
      color: var(--accent);
      outline: none;
    }
    .btn-crt:active { background: var(--bg-panel-elevated); }
    .btn-link { text-decoration: none; display: inline-block; }

    .btn-start {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 24px 72px;
      font-size: 28px;
      letter-spacing: 0.35em;
      box-shadow: 0 0 24px var(--accent), inset 0 0 24px rgba(126,200,227,0.1);
      animation: start-pulse 2s ease-in-out infinite;
      min-height: 96px;
    }
    @keyframes start-pulse {
      0%,100% { box-shadow: 0 0 24px var(--accent), inset 0 0 24px rgba(126,200,227,0.1); }
      50%     { box-shadow: 0 0 40px var(--accent), inset 0 0 32px rgba(126,200,227,0.18); }
    }
    .btn-start:hover { background: rgba(126,200,227,0.1); box-shadow: 0 0 48px var(--accent); }

    /* Branch list: narrower than the ornament field, centered under the lockup.
       Spec: ~40% viewport width or a fixed max centered. */
    .wide-title-branches {
      display: flex; flex-direction: column;
      gap: 14px;
      width: min(40vw, 420px);
      min-width: 280px;
    }
    .wide-title-branches .branch-row {
      display: flex; gap: 14px;
    }
    .wide-title-branches .branch-row .btn-crt { flex: 1; }
    .hidden-branch { display: none; }

    .wide-title-footer {
      text-align: center;
    }
    .wide-title-footer p {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <!-- ═══ FULL-VIEWPORT CRT EFFECT LAYERS ═══ -->
  <div class="crt-grille"></div>
  <div class="crt-vignette"></div>
  <div class="crt-tracking"></div>
  <div class="crt-scanlines"></div>
  <div class="crt-grain"></div>
  <div class="crt-border"></div>
  <div class="crt-flash"></div>
  <div class="crt-glitch-bars" id="glitch-bars"></div>
  <div class="crt-noise-lines" id="noise-lines"></div>
  <div class="crt-vhs" id="vhs-event"></div>

  <!-- ═══ CENTERED TITLE STACK — full viewport, no dock ═══ -->
  <div class="wide-title-screen">

    <div class="wide-title-header">Glitch Forgeworks</div>

    <div class="wide-title-body">
      <div class="wide-title-lockup">
        <div class="wide-title-ornament"></div>
        <h1 class="wide-title-word title-glitch" data-text="OPERATOR'S">OPERATOR'S</h1>
        <h1 class="wide-title-word title-glitch" data-text="DESCENT">DESCENT</h1>
        <div class="wide-title-ornament"></div>
        <p class="wide-title-tagline">DEPTH IS THE SCORE</p>
      </div>

      <button class="btn-crt btn-start" onclick="toggleBranches()">START</button>

      <div id="branches" class="hidden-branch wide-title-branches">
        <a href="creation.html" class="btn-crt btn-link">◈ Begin New Run</a>
        <a href="library.html"  class="btn-crt btn-link">◈ Run Library</a>
        <a href="import.html"   class="btn-crt btn-link">◈ Import Link</a>
        <div class="branch-row">
          <a href="tutorial.html" class="btn-crt btn-link">Tutorial</a>
          <a href="settings.html" class="btn-crt btn-link">Settings</a>
        </div>
      </div>
    </div>

    <div class="wide-title-footer">
      <p>v1.0 · BUILD · OFFLINE READY</p>
      <p>PRESS START TO POWER ON</p>
    </div>

  </div>

  <script>
    // ═══════════════════════════════════════════════
    //  WIDE SHELL SCRIPT BLOCK — copy verbatim across all mocks/wide/*.html files.
    //  (CRT glitch scheduler + text-glitch + jitter + tab handler + log auto-scroll.)
    // ═══════════════════════════════════════════════

    // Safe pool for character substitution (Latin, digits, box-drawing)
    const safePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789░▒▓█▀▄';

    // — Glitch bars: 350-999ms, 40% fire, 80-249ms, 1-4px tall, ±8px offset, alpha 0.1-0.5 —
    const glitchBarsEl = document.getElementById('glitch-bars');
    function scheduleGlitchBar() {
      const delay = 350 + Math.random() * 649;
      setTimeout(() => {
        if (Math.random() < 0.40) {
          const bar = document.createElement('div');
          bar.className = 'glitch-bar';
          const height = 1 + Math.floor(Math.random() * 4);
          const offset = -8 + Math.floor(Math.random() * 17);
          const alpha = 0.1 + Math.random() * 0.4;
          const top = Math.random() * 100;
          bar.style.cssText = `top: ${top}%; height: ${height}px; opacity: ${alpha}; transform: translateX(${offset}px);`;
          glitchBarsEl.appendChild(bar);
          setTimeout(() => bar.remove(), 80 + Math.random() * 169);
        }
        scheduleGlitchBar();
      }, delay);
    }
    scheduleGlitchBar();

    // — Noise lines: 1200-3499ms, 30% fire, 80-299ms —
    const noiseLinesEl = document.getElementById('noise-lines');
    function scheduleNoiseLine() {
      const delay = 1200 + Math.random() * 2299;
      setTimeout(() => {
        if (Math.random() < 0.30) {
          const line = document.createElement('div');
          line.className = 'noise-line';
          const charCount = 8 + Math.floor(Math.random() * 21);
          let noise = '';
          for (let i = 0; i < charCount * 4; i++) noise += safePool[Math.floor(Math.random() * safePool.length)];
          const top = Math.random() * 100;
          line.style.cssText = `top: ${top}%;`;
          line.textContent = noise;
          noiseLinesEl.appendChild(line);
          setTimeout(() => line.remove(), 80 + Math.random() * 219);
        }
        scheduleNoiseLine();
      }, delay);
    }
    scheduleNoiseLine();

    // — VHS events: 4000-9999ms, 80-249ms —
    const vhsEl = document.getElementById('vhs-event');
    function scheduleVHSEvent() {
      const delay = 4000 + Math.random() * 5999;
      setTimeout(() => {
        vhsEl.classList.add('active');
        setTimeout(() => vhsEl.classList.remove('active'), 80 + Math.random() * 169);
        scheduleVHSEvent();
      }, delay);
    }
    scheduleVHSEvent();

    // — Element jitter: 500-1399ms, 30% per-element fire, 70-199ms, ±3px x / ±2px y —
    const jitterTargets = document.querySelectorAll('.jitter-target');
    function scheduleJitter() {
      const delay = 500 + Math.random() * 899;
      setTimeout(() => {
        jitterTargets.forEach(el => {
          if (Math.random() < 0.30) {
            const dx = -3 + Math.floor(Math.random() * 7);
            const dy = -2 + Math.floor(Math.random() * 5);
            el.style.transform = `translate(${dx}px, ${dy}px)`;
            setTimeout(() => { el.style.transform = ''; }, 70 + Math.random() * 129);
          }
        });
        scheduleJitter();
      }, delay);
    }
    scheduleJitter();

    // — Per-element text glitch (FR-23): character substitution + chromatic ghosts —
    const glitchSafePool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789░▒▓█▀▄■□';
    function initTextGlitch() {
      const sels = ['.glow','.glow-strong','.accent-text','.chroma-text','.wide-mode-tab','.theme-badge'];
      const seen = new Set();
      sels.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          if (seen.has(el)) return; seen.add(el);
          const text = el.textContent.trim();
          if (text.length < 2 || text.length > 40) return;
          if (el.closest('button,.dpad-btn,.action-btn,.stepper-btn')) return;
          let intensity = 0.06;
          if (el.classList.contains('glow-strong') || el.classList.contains('chroma-text')) intensity = 0.20;
          else if (el.classList.contains('accent-text')) intensity = 0.10;
          else if (el.classList.contains('wide-mode-tab')) intensity = 0.08;
          else if (el.classList.contains('theme-badge')) intensity = 0.12;
          el.dataset.glitch = intensity;
          const heartbeat = 700 + Math.random() * 1099;
          function tick() {
            setTimeout(() => {
              if (el.offsetParent !== null && Math.random() < parseFloat(el.dataset.glitch)) doTextSwap(el);
              tick();
            }, heartbeat);
          }
          tick();
        });
      });
    }
    function doTextSwap(el) {
      const orig = el.textContent;
      if (orig.length < 1) return;
      const numSwaps = Math.min(orig.length, 1 + Math.floor(Math.random() * 2));
      const positions = [];
      while (positions.length < numSwaps && positions.length < orig.length) {
        const pos = Math.floor(Math.random() * orig.length);
        if (!positions.includes(pos)) positions.push(pos);
      }
      const chars = orig.split('');
      positions.forEach(pos => { chars[pos] = glitchSafePool[Math.floor(Math.random() * glitchSafePool.length)]; });
      el.textContent = chars.join('');
      el.dataset.ghostText = chars.join('');
      el.classList.add('text-swapping');
      el.style.transform = `translate(${-3 + Math.floor(Math.random() * 7)}px, ${-1 + Math.floor(Math.random() * 3)}px)`;
      setTimeout(() => {
        el.textContent = orig;
        el.classList.remove('text-swapping');
        el.style.transform = '';
        delete el.dataset.ghostText;
      }, 120 + Math.random() * 229);
    }
    initTextGlitch();

    // — Console tab click handler (wide) —
    document.querySelectorAll('.wide-mode-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        if (this.classList.contains('disabled')) return;
        document.querySelectorAll('.wide-mode-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // — Telemetry log auto-scroll to newest —
    const telemetryLog = document.getElementById('telemetry-log');
    if (telemetryLog) telemetryLog.scrollTop = telemetryLog.scrollHeight;

    // ═══════════════════════════════════════════════
    //  END WIDE SHELL SCRIPT BLOCK
    // ═══════════════════════════════════════════════

    // ═══════════════════════════════════════════════
    //  TITLE-SPECIFIC — START button toggles branch list.
    //  Matches portrait mocks/title.html behavior; same class + function names.
    // ═══════════════════════════════════════════════
    function toggleBranches() {
      const el = document.getElementById('branches');
      el.style.display = (el.style.display === 'none' || !el.style.display) ? 'flex' : 'none';
    }
  </script>
</body>
</html>
