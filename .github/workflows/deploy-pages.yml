name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Regenerate committed assets
        run: npm run build:assets

      - name: Reject generated-file drift
        run: git diff --exit-code -- ./styles/tailwind.css ./assets/icons.svg

      - name: Verify production manifest
        run: npm run check:assets

      - name: Run Pages contract tests
        run: npx vitest run ./tests/integration/service-worker.test.js ./tests/tools/build-pages.test.js ./tests/tooling/github-pages-workflow.test.js

      - name: Stage Pages artifact
        run: npm run build:pages -- --output "${RUNNER_TEMP}/operator-s-descent-pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/operator-s-descent-pages

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
